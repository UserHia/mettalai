<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MettalAI — нейросеть</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <div class="logo">🧠 MettalAI</div>
            <div class="status">онлайн</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="text">Привет! Я MettalAI. Задай любой вопрос — я помогу.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Напиши сообщение..." autocomplete="off">
            <button id="sendBtn">📤</button>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
